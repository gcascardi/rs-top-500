name: Supabase keepalive

on:
  schedule:
    # 12:17 UTC = 09:17 em America/Sao_Paulo.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar album_progress
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo '::error::Configure os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY no repositório.'
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            --retry-max-time 150 \
            --output /dev/null \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/album_progress?select=album_id&limit=1"

          echo 'Consulta ao banco concluída com sucesso.'
